<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <style>
      :root {
        --ink: #192026;
        --muted: #5d6972;
        --paper: #fbfaf5;
        --chalk: #eef2ef;
        --line: #cbd5d1;
        --moss: #315f4f;
        --cobalt: #2c5d8f;
        --rust: #b95f3b;
        --gold: #d9b44a;
        --shadow: 0 24px 60px rgba(25, 32, 38, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Iowan Old Style", "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
        color: var(--ink);
        background:
          linear-gradient(rgba(25, 32, 38, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(25, 32, 38, 0.035) 1px, transparent 1px),
          var(--chalk);
        background-size: 34px 34px;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        background:
          radial-gradient(circle at 10% 20%, rgba(217, 180, 74, 0.16), transparent 28%),
          radial-gradient(circle at 82% 8%, rgba(44, 93, 143, 0.14), transparent 25%),
          linear-gradient(135deg, rgba(49, 95, 79, 0.1), transparent 44%);
        pointer-events: none;
      }

      a {
        color: inherit;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      main {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 36px 0 80px;
      }

      .site-header,
      .site-footer {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 0 10px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        color: var(--paper);
        background: var(--ink);
        border-radius: 50%;
      }

      .site-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
        color: var(--muted);
      }

      .site-nav a {
        text-decoration: none;
      }

      .site-nav a:hover {
        color: var(--ink);
      }

      .site-footer {
        padding: 28px 0 36px;
        border-top: 1px solid rgba(25, 32, 38, 0.14);
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
        color: var(--muted);
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .eyebrow {
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 12px;
        font-weight: 800;
        color: var(--rust);
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
        gap: 48px;
        align-items: center;
        min-height: 620px;
        padding: 34px 0 70px;
      }

      .hero h1 {
        max-width: 760px;
        margin-bottom: 24px;
        font-size: clamp(48px, 7vw, 92px);
        line-height: 1.02;
        font-weight: 800;
      }

      .hero h1 span {
        color: var(--moss);
      }

      .hero-copy {
        max-width: 650px;
        margin-bottom: 32px;
        font-size: clamp(18px, 2vw, 22px);
        line-height: 1.75;
        color: #36434b;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        border-radius: 4px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(25, 32, 38, 0.12);
      }

      .button.primary {
        color: var(--paper);
        background: var(--ink);
      }

      .signal-board {
        position: relative;
        min-height: 500px;
        padding: 28px;
        overflow: hidden;
        background: #16242b;
        border: 1px solid rgba(25, 32, 38, 0.3);
        border-radius: 8px;
        box-shadow: var(--shadow);
        color: var(--paper);
      }

      .signal-board::before {
        position: absolute;
        inset: 18px;
        content: "";
        border: 1px solid rgba(251, 250, 245, 0.18);
        border-radius: 6px;
      }

      .signal-grid {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(251, 250, 245, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(251, 250, 245, 0.08) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
      }

      .signal-content {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 22px;
        height: 100%;
      }

      .note-strip {
        align-self: start;
        width: 76%;
        padding: 16px;
        color: var(--ink);
        background: #f0d276;
        border-radius: 4px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
        transform: rotate(-2deg);
      }

      .note-strip strong {
        display: block;
        margin-bottom: 8px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
      }

      .signal-card {
        display: grid;
        gap: 12px;
        width: 82%;
        margin-left: auto;
        padding: 18px;
        background: rgba(251, 250, 245, 0.08);
        border: 1px solid rgba(251, 250, 245, 0.2);
        border-radius: 8px;
        backdrop-filter: blur(8px);
      }

      .signal-card p,
      .note-strip p {
        margin: 0;
        line-height: 1.65;
      }

      .signal-meter {
        display: grid;
        grid-template-columns: 1fr 1.5fr 0.8fr;
        gap: 8px;
        align-items: end;
        min-height: 160px;
        margin-top: auto;
      }

      .signal-meter span {
        display: block;
        border-radius: 4px 4px 0 0;
        background: var(--moss);
      }

      .signal-meter span:nth-child(1) {
        height: 62px;
        background: var(--rust);
      }

      .signal-meter span:nth-child(2) {
        height: 138px;
        background: var(--gold);
      }

      .signal-meter span:nth-child(3) {
        height: 94px;
        background: var(--cobalt);
      }

      .section {
        padding: 64px 0;
        border-top: 1px solid rgba(25, 32, 38, 0.12);
      }

      .section-heading {
        display: grid;
        grid-template-columns: minmax(0, 0.8fr) minmax(280px, 1fr);
        gap: 36px;
        align-items: end;
        margin-bottom: 28px;
      }

      .section h1,
      .section h2 {
        margin-bottom: 0;
        font-size: clamp(30px, 4vw, 52px);
        line-height: 1.12;
      }

      .section-heading p {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.75;
      }

      .profile-panel {
        display: grid;
        grid-template-columns: minmax(0, 1.16fr) minmax(320px, 0.84fr);
        gap: 26px;
        align-items: stretch;
      }

      .profile-photo {
        position: relative;
        min-height: 460px;
        margin: 0;
        overflow: hidden;
        border: 1px solid rgba(25, 32, 38, 0.18);
        border-radius: 8px;
        box-shadow: var(--shadow);
        background: var(--ink);
      }

      .profile-photo::after {
        position: absolute;
        inset: 0;
        content: "";
        background: linear-gradient(180deg, transparent 62%, rgba(25, 32, 38, 0.2));
        pointer-events: none;
      }

      .profile-photo img {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 460px;
        object-fit: cover;
        object-position: 50% 56%;
      }

      .profile-copy {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 460px;
        padding: 30px;
        background: rgba(251, 250, 245, 0.9);
        border: 1px solid rgba(25, 32, 38, 0.14);
        border-radius: 8px;
        box-shadow: 0 16px 40px rgba(25, 32, 38, 0.08);
      }

      .profile-copy h2 {
        margin-bottom: 24px;
      }

      .intro-placeholder {
        margin-top: auto;
        padding-top: 26px;
        border-top: 1px solid rgba(25, 32, 38, 0.14);
      }

      .intro-placeholder p {
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.78;
      }

      .share-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .share-card {
        display: flex;
        flex-direction: column;
        min-height: 250px;
        padding: 24px;
        background: rgba(251, 250, 245, 0.86);
        border: 1px solid rgba(25, 32, 38, 0.14);
        border-radius: 8px;
        box-shadow: 0 16px 40px rgba(25, 32, 38, 0.08);
        text-decoration: none;
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .share-card:hover {
        transform: translateY(-4px);
        border-color: rgba(25, 32, 38, 0.32);
        box-shadow: 0 20px 46px rgba(25, 32, 38, 0.12);
      }

      .share-card h2,
      .share-card h3 {
        margin-bottom: 14px;
        font-size: 24px;
        line-height: 1.25;
      }

      .share-card p {
        margin-bottom: 22px;
        color: var(--muted);
        line-height: 1.72;
      }

      .card-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 16px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
      }

      .card-meta::after {
        width: 12px;
        height: 12px;
        content: "";
        border-radius: 50%;
        background: var(--moss);
      }

      .share-card.accent-cobalt .card-meta::after {
        background: var(--cobalt);
      }

      .share-card.accent-rust .card-meta::after {
        background: var(--rust);
      }

      .share-card.accent-gold .card-meta::after {
        background: var(--gold);
      }

      .share-card .tag-row {
        margin-top: auto;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag-row span {
        padding: 5px 9px;
        border: 1px solid rgba(25, 32, 38, 0.14);
        border-radius: 999px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 12px;
        color: #3f4b53;
        background: #ffffffa6;
      }

      .category-tags {
        margin-top: -28px;
      }

      .journal-band {
        display: grid;
        grid-template-columns: minmax(260px, 0.76fr) minmax(0, 1.24fr);
        gap: 26px;
        align-items: stretch;
      }

      .journal-lead {
        padding: 28px;
        color: var(--paper);
        background: var(--moss);
        border-radius: 8px;
      }

      .journal-lead h3 {
        font-size: 32px;
        line-height: 1.18;
      }

      .journal-lead p {
        color: rgba(251, 250, 245, 0.82);
        line-height: 1.75;
      }

      .journal-list {
        display: grid;
        gap: 1px;
        overflow: hidden;
        border: 1px solid rgba(25, 32, 38, 0.14);
        border-radius: 8px;
        background: rgba(25, 32, 38, 0.14);
      }

      .journal-item {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 20px;
        padding: 22px;
        background: rgba(251, 250, 245, 0.9);
      }

      .journal-item time {
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
        color: var(--rust);
      }

      .journal-item h3 {
        margin-bottom: 6px;
        font-size: 22px;
      }

      .journal-item p {
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .post-list {
        display: grid;
        gap: 1px;
        overflow: hidden;
        border: 1px solid rgba(25, 32, 38, 0.14);
        border-radius: 8px;
        background: rgba(25, 32, 38, 0.14);
      }

      .post-row {
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr) auto;
        gap: 22px;
        align-items: center;
        padding: 22px;
        background: rgba(251, 250, 245, 0.9);
        text-decoration: none;
      }

      .post-row:hover h3 {
        color: var(--moss);
      }

      .post-row time,
      .post-row .post-category {
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
        color: var(--rust);
      }

      .post-row h3 {
        margin-bottom: 6px;
        font-size: 22px;
        transition: color 160ms ease;
      }

      .post-row p {
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .empty-state {
        padding: 28px;
        color: var(--muted);
        background: rgba(251, 250, 245, 0.9);
        border: 1px dashed rgba(25, 32, 38, 0.24);
        border-radius: 8px;
        line-height: 1.75;
      }

      .index-links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .index-link {
        display: grid;
        gap: 12px;
        min-height: 190px;
        padding: 24px;
        color: var(--paper);
        background: var(--ink);
        border-radius: 8px;
        text-decoration: none;
      }

      .index-link:nth-child(2) {
        color: var(--ink);
        background: var(--gold);
      }

      .index-link h3 {
        margin-bottom: 0;
        font-size: 30px;
      }

      .index-link p {
        margin-bottom: 0;
        color: inherit;
        line-height: 1.72;
        opacity: 0.82;
      }

      .article-wrapper {
        display: grid;
        grid-template-columns: 200px minmax(0, 860px);
        gap: 48px;
        justify-content: center;
        padding: 52px 0 0;
        transition: grid-template-columns 250ms ease;
      }

      .article-wrapper.toc-collapsed {
        grid-template-columns: 32px minmax(0, 860px);
        gap: 20px;
      }

      .article-wrapper .article {
        max-width: none;
        margin: 0;
        padding: 0 0 80px;
      }

      .article-wrapper.no-toc {
        grid-template-columns: minmax(0, 860px);
        padding: 52px 0 0;
      }

      .article-wrapper.no-toc .article {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 0 80px;
      }

      .article {
        max-width: 860px;
        margin: 0 auto;
        padding: 52px 0 80px;
      }

      .article-toc {
        position: sticky;
        top: 24px;
        align-self: start;
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        overflow-x: hidden;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
        padding-right: 7px;
        scrollbar-width: thin;
        scrollbar-color: var(--line) transparent;
        transition: width 250ms ease;
      }

      .article-toc.collapsed {
        overflow: hidden;
        padding-right: 0;
      }

      .article-toc.collapsed .toc-nav {
        opacity: 0;
        visibility: hidden;
        transition: opacity 150ms ease, visibility 0ms 150ms;
      }

      .toc-nav {
        transition: opacity 150ms ease, visibility 0ms 0ms;
      }

      .toc-toggle {
        display: flex;
        position: sticky;
        top: 0;
        z-index: 1;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--paper);
        color: var(--muted);
        cursor: pointer;
        align-items: center;
        justify-content: center;
        transition: color 160ms, border-color 160ms;
      }

      .toc-toggle:hover {
        color: var(--ink);
        border-color: var(--ink);
      }

      .toc-toggle svg {
        transition: transform 250ms ease;
      }

      .article-toc.collapsed .toc-toggle {
        position: static;
        margin-bottom: 0;
      }

      .article-toc.collapsed .toc-toggle svg {
        transform: rotate(180deg);
      }

      .article-toc:not(.collapsed) .toc-toggle {
        position: absolute;
        top: 0;
        right: 0;
      }

      .toc-title {
        margin: 0 0 14px 0;
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .toc-list li + li {
        margin-top: 1px;
      }

      .toc-list a {
        display: block;
        padding: 4px 0 4px 12px;
        color: var(--muted);
        text-decoration: none;
        border-left: 2px solid transparent;
        line-height: 1.45;
        transition: color 160ms, border-color 160ms;
      }

      .toc-list a:hover {
        color: var(--ink);
        border-left-color: var(--line);
      }

      .toc-list a.active {
        color: var(--ink);
        border-left-color: var(--moss);
        font-weight: 600;
      }

      .toc-list a.toc-h3 {
        padding-left: 24px;
        font-size: 12px;
      }

      .article-header {
        margin-bottom: 40px;
        padding-bottom: 28px;
        border-bottom: 1px solid rgba(25, 32, 38, 0.14);
      }

      .article-header h1 {
        margin-bottom: 18px;
        font-size: clamp(36px, 5vw, 64px);
        line-height: 1.12;
      }

      .article-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 18px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
        color: var(--muted);
      }

      .article-body {
        font-size: 18px;
        line-height: 1.85;
      }

      .article-body h2,
      .article-body h3 {
        margin: 42px 0 14px;
        line-height: 1.24;
      }

      .article-body h2 {
        font-size: 32px;
      }

      .article-body h3 {
        font-size: 24px;
      }

      .article-body p {
        margin-bottom: 22px;
        text-indent: 2em;
      }

      .article-body ul,
      .article-body ol,
      .article-body table,
      .article-body pre {
        margin-bottom: 22px;
      }

      .article-body img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
      }

      .article-body a {
        color: var(--cobalt);
      }

      /* Rouge syntax highlighting (Monokai) */
      .article-body .highlight { color:#f8f8f2; background:var(--ink); border-radius:8px; }
      .article-body .highlight .c, .article-body .highlight .ch, .article-body .highlight .cd,
      .article-body .highlight .cpf, .article-body .highlight .cm, .article-body .highlight .c1 { color:#75715e; font-style:italic; }
      .article-body .highlight .cp { color:#75715e; font-weight:bold; }
      .article-body .highlight .cs { color:#75715e; font-weight:bold; font-style:italic; }
      .article-body .highlight .k, .article-body .highlight .kv, .article-body .highlight .kc,
      .article-body .highlight .highlight .kd, .article-body .highlight .kp,
      .article-body .highlight .kr, .article-body .highlight .kt { color:#66d9ef; font-weight:bold; }
      .article-body .highlight .kn, .article-body .highlight .ow, .article-body .highlight .o { color:#f92672; font-weight:bold; }
      .article-body .highlight .s, .article-body .highlight .dl, .article-body .highlight .sb,
      .article-body .highlight .sc, .article-body .highlight .sd, .article-body .highlight .s2,
      .article-body .highlight .sh, .article-body .highlight .si, .article-body .highlight .sx,
      .article-body .highlight .sr, .article-body .highlight .s1, .article-body .highlight .ss { color:#e6db74; }
      .article-body .highlight .sa { color:#66d9ef; font-weight:bold; }
      .article-body .highlight .se { color:#ae81ff; }
      .article-body .highlight .m, .article-body .highlight .mb, .article-body .highlight .mx,
      .article-body .highlight .mf, .article-body .highlight .mh, .article-body .highlight .il,
      .article-body .highlight .mi, .article-body .highlight .mo { color:#ae81ff; }
      .article-body .highlight .na { color:#a6e22e; }
      .article-body .highlight .nc, .article-body .highlight .nd, .article-body .highlight .ne,
      .article-body .highlight .nf, .article-body .highlight .fm { color:#a6e22e; font-weight:bold; }
      .article-body .highlight .no { color:#66d9ef; }
      .article-body .highlight .bp, .article-body .highlight .nb, .article-body .highlight .ni,
      .article-body .highlight .nn, .article-body .highlight .vc, .article-body .highlight .vg,
      .article-body .highlight .vi, .article-body .highlight .nv, .article-body .highlight .vm,
      .article-body .highlight .w, .article-body .highlight .nl { color:#f8f8f2; }
      .article-body .highlight .nt { color:#f92672; }

      .article-body pre {
        overflow-x: auto;
        padding: 18px;
        color: var(--paper);
        background: var(--ink);
        border-radius: 8px;
      }

      .article-body code {
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 0.92em;
      }

      .article-body p code,
      .article-body li code,
      .article-body td code {
        padding: 2px 5px;
        background: rgba(25, 32, 38, 0.08);
        border-radius: 4px;
      }

      .article-body table {
        display: block;
        width: 100%;

  <body>
    <canvas id="petal-canvas" style="position:fixed;inset:0;z-index:9999;pointer-events:none;"></canvas>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">明</span>
        <span>{{ site.title }}</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}#columns">栏目</a>
        <a href="{{ '/' | relative_url }}#latest">最新</a>
        <a href="{{ '/categories/' | relative_url }}">分类</a>
        <a href="{{ '/archive/' | relative_url }}">归档</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>写给正在学习、实践、复盘的人。</span>
      <span id="busuanzi_container_site_pv" style="display:none;margin-left:18px;">
        总访问 <span id="busuanzi_value_site_pv"></span> 次
      </span>
    </footer>

    <script>
      document.querySelectorAll('.carousel').forEach(function (el) {
        var track = el.querySelector('.carousel-track');
        var images = track.querySelectorAll('img');
        var dots = el.querySelector('.carousel-dots');
        var counter = el.querySelector('.carousel-counter');
        var index = 0;
        var total = images.length;

        function goTo(i) {
          if (i < 0) i = total - 1;
          if (i >= total) i = 0;
          index = i;
          track.style.transform = 'translateX(-' + (index * 100) + '%)';
          if (dots) {
            dots.querySelectorAll('.carousel-dot').forEach(function (d, j) {
              d.classList.toggle('active', j === index);
            });
          }
          if (counter) counter.textContent = (index + 1) + ' / ' + total;
        }

        var prevBtn = el.querySelector('.carousel-btn-prev');
        var nextBtn = el.querySelector('.carousel-btn-next');
        if (prevBtn) prevBtn.addEventListener('click', function () { goTo(index - 1); });
        if (nextBtn) nextBtn.addEventListener('click', function () { goTo(index + 1); });

        if (dots) {
          dots.querySelectorAll('.carousel-dot').forEach(function (d, i) {
            d.addEventListener('click', function () { goTo(i); });
          });
        }

        el.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(index - 1); }
          if (e.key === 'ArrowRight') { e.preventDefault(); goTo(index + 1); }
        });
        el.setAttribute('tabindex', '0');

        // autoplay
        var autoplay = el.getAttribute('data-autoplay');
        if (autoplay) {
          var timer = setInterval(function () { goTo(index + 1); }, parseInt(autoplay, 10));
          el.addEventListener('mouseenter', function () { clearInterval(timer); });
          el.addEventListener('mouseleave', function () {
            timer = setInterval(function () { goTo(index + 1); }, parseInt(autoplay, 10));
          });
        }

        // touch / swipe
        var startX = 0;
        el.addEventListener('touchstart', function (e) {
          startX = e.changedTouches[0].screenX;
        }, { passive: true });
        el.addEventListener('touchend', function (e) {
          var diff = startX - e.changedTouches[0].screenX;
          if (Math.abs(diff) > 50) {
            goTo(index + (diff > 0 ? 1 : -1));
          }
        }, { passive: true });

        goTo(0);
      });
    </script>
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <script>
      (function() {
        var canvas = document.getElementById('petal-canvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var petals = [];
        var PETAL_COUNT = 35;
        var colors = [
          'rgba(255,183,197,0.85)', 'rgba(255,167,183,0.8)',
          'rgba(255,149,169,0.75)', 'rgba(255,200,210,0.7)',
          'rgba(255,175,189,0.8)', 'rgba(255,190,200,0.7)'
        ];

        function Petal() {
          this.reset(true);
        }

        Petal.prototype.reset = function(init) {
          this.x = init ? Math.random() * canvas.width : canvas.width + 60;
          this.y = init ? Math.random() * canvas.height : -40 - Math.random() * 200;
          this.size = 8 + Math.random() * 16;
          this.speedX = 0.4 + Math.random() * 0.7;
          this.speedY = 0.3 + Math.random() * 0.6;
          this.rotation = Math.random() * Math.PI * 2;
          this.rotationSpeed = (Math.random() - 0.3) * 0.03;
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.tick = Math.random() * 1000;
        };

        Petal.prototype.update = function() {
          this.tick++;
          this.y += this.speedY;
          this.x -= this.speedX + Math.sin(this.tick * 0.01) * 0.3;
          this.rotation += this.rotationSpeed;
          if (this.y > canvas.height + 50 || this.x < -60) {
            this.y = -50 - Math.random() * 200;
            this.x = canvas.width + 60 + Math.random() * 100;
          }
        };

        Petal.prototype.draw = function(ctx) {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          var s = this.size;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-s * 0.4, s * 0.3, -s * 0.7, s * 0.8, 0, s);
          ctx.bezierCurveTo(s * 0.7, s * 0.8, s * 0.4, s * 0.3, 0, 0);
          ctx.fill();
          ctx.restore();
        };

        function resize() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }

        function animate() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (var i = 0; i < petals.length; i++) {
            petals[i].update();
            petals[i].draw(ctx);
          }
          requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        for (var i = 0; i < PETAL_COUNT; i++) {
          petals.push(new Petal());
        }
        animate();
      })();
    </script>
