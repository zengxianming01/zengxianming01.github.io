<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <style>
      :root {
        --ink: #192026;
        --muted: #5d6972;
        --paper: #fbfaf5;
        --chalk: #eef2ef;
        --line: #cbd5d1;
        --moss: #315f4f;
        --cobalt: #2c5d8f;
        --rust: #b95f3b;
        --gold: #d9b44a;
        --shadow: 0 24px 60px rgba(25, 32, 38, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Iowan Old Style", "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
        color: var(--ink);
        background:
          linear-gradient(rgba(25, 32, 38, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(25, 32, 38, 0.035) 1px, transparent 1px),
          var(--chalk);
        background-size: 34px 34px;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        background:
          radial-gradient(circle at 10% 20%, rgba(217, 180, 74, 0.16), transparent 28%),
          radial-gradient(circle at 82% 8%, rgba(44, 93, 143, 0.14), transparent 25%),
          linear-gradient(135deg, rgba(49, 95, 79, 0.1), transparent 44%);
        pointer-events: none;
      }

      a {
        color: inherit;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      main {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: 36px 0 80px;
      }

      .site-header,
      .site-footer {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 22px 0 10px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        color: var(--paper);
        background: var(--ink);
        border-radius: 50%;
      }

      .site-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
        color: var(--muted);
      }

      .site-nav a {
        text-decoration: none;
      }

      .site-footer {
        padding: 28px 0 36px;
        border-top: 1px solid rgba(25, 32, 38, 0.14);
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
        color: var(--muted);
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      .eyebrow {
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 12px;
        font-weight: 800;
        color: var(--rust);
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
        gap: 48px;
        align-items: center;
        min-height: 620px;
        padding: 34px 0 70px;
      }

      .hero h1 {
        max-width: 760px;
        margin-bottom: 24px;
        font-size: clamp(48px, 7vw, 92px);
        line-height: 1.02;
        font-weight: 800;
      }

      .hero h1 span {
        color: var(--moss);
      }

      .hero-copy {
        max-width: 650px;
        margin-bottom: 32px;
        font-size: clamp(18px, 2vw, 22px);
        line-height: 1.75;
        color: #36434b;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        border-radius: 4px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(25, 32, 38, 0.12);
      }

      .button.primary {
        color: var(--paper);
        background: var(--ink);
      }

      .signal-board {
        position: relative;
        min-height: 500px;
        padding: 28px;
        overflow: hidden;
        background: #16242b;
        border: 1px solid rgba(25, 32, 38, 0.3);
        border-radius: 8px;
        box-shadow: var(--shadow);
        color: var(--paper);
      }

      .signal-board::before {
        position: absolute;
        inset: 18px;
        content: "";
        border: 1px solid rgba(251, 250, 245, 0.18);
        border-radius: 6px;
      }

      .signal-grid {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(251, 250, 245, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(251, 250, 245, 0.08) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
      }

      .signal-content {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 22px;
        height: 100%;
      }

      .note-strip {
        align-self: start;
        width: 76%;
        padding: 16px;
        color: var(--ink);
        background: #f0d276;
        border-radius: 4px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
        transform: rotate(-2deg);
      }

      .note-strip strong {
        display: block;
        margin-bottom: 8px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
      }

      .signal-card {
        display: grid;
        gap: 12px;
        width: 82%;
        margin-left: auto;
        padding: 18px;
        background: rgba(251, 250, 245, 0.08);
        border: 1px solid rgba(251, 250, 245, 0.2);
        border-radius: 8px;
        backdrop-filter: blur(8px);
      }

      .signal-card p,
      .note-strip p {
        margin: 0;
        line-height: 1.65;
      }

      .signal-meter {
        display: grid;
        grid-template-columns: 1fr 1.5fr 0.8fr;
        gap: 8px;
        align-items: end;
        min-height: 160px;
        margin-top: auto;
      }

      .signal-meter span {
        display: block;
        border-radius: 4px 4px 0 0;
        background: var(--moss);
      }

      .signal-meter span:nth-child(1) {
        height: 62px;
        background: var(--rust);
      }

      .signal-meter span:nth-child(2) {
        height: 138px;
        background: var(--gold);
      }

      .signal-meter span:nth-child(3) {
        height: 94px;
        background: var(--cobalt);
      }

      .section {
        padding: 64px 0;
        border-top: 1px solid rgba(25, 32, 38, 0.12);
      }

      .section-heading {
        display: grid;
        grid-template-columns: minmax(0, 0.8fr) minmax(280px, 1fr);
        gap: 36px;
        align-items: end;
        margin-bottom: 28px;
      }

      .section h2 {
        margin-bottom: 0;
        font-size: clamp(30px, 4vw, 52px);
        line-height: 1.12;
      }

      .section-heading p {
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.75;
      }

      .share-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .share-card {
        min-height: 250px;
        padding: 24px;
        background: rgba(251, 250, 245, 0.86);
        border: 1px solid rgba(25, 32, 38, 0.14);
        border-radius: 8px;
        box-shadow: 0 16px 40px rgba(25, 32, 38, 0.08);
      }

      .share-card h3 {
        margin-bottom: 14px;
        font-size: 24px;
        line-height: 1.25;
      }

      .share-card p {
        margin-bottom: 22px;
        color: var(--muted);
        line-height: 1.72;
      }

      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tag-row span {
        padding: 5px 9px;
        border: 1px solid rgba(25, 32, 38, 0.14);
        border-radius: 999px;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 12px;
        color: #3f4b53;
        background: #ffffffa6;
      }

      .journal-band {
        display: grid;
        grid-template-columns: minmax(260px, 0.76fr) minmax(0, 1.24fr);
        gap: 26px;
        align-items: stretch;
      }

      .journal-lead {
        padding: 28px;
        color: var(--paper);
        background: var(--moss);
        border-radius: 8px;
      }

      .journal-lead h3 {
        font-size: 32px;
        line-height: 1.18;
      }

      .journal-lead p {
        color: rgba(251, 250, 245, 0.82);
        line-height: 1.75;
      }

      .journal-list {
        display: grid;
        gap: 1px;
        overflow: hidden;
        border: 1px solid rgba(25, 32, 38, 0.14);
        border-radius: 8px;
        background: rgba(25, 32, 38, 0.14);
      }

      .journal-item {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 20px;
        padding: 22px;
        background: rgba(251, 250, 245, 0.9);
      }

      .journal-item time {
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-size: 13px;
        color: var(--rust);
      }

      .journal-item h3 {
        margin-bottom: 6px;
        font-size: 22px;
      }

      .journal-item p {
        margin-bottom: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .closing {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 28px;
        align-items: center;
        padding: 34px;
        color: var(--paper);
        background: var(--ink);
        border-radius: 8px;
      }

      .closing p {
        max-width: 680px;
        margin-bottom: 0;
        color: rgba(251, 250, 245, 0.78);
        font-size: 18px;
        line-height: 1.75;
      }

      .closing-mark {
        display: grid;
        width: 118px;
        height: 118px;
        place-items: center;
        color: var(--ink);
        background: var(--gold);
        border-radius: 50%;
        font-family: "Avenir Next", "PingFang SC", sans-serif;
        font-weight: 900;
      }

      @media (max-width: 860px) {
        .site-header,
        main,
        .site-footer {
          width: min(100% - 28px, 1120px);
        }

        .site-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .hero,
        .section-heading,
        .journal-band,
        .closing {
          grid-template-columns: 1fr;
        }

        .hero {
          min-height: auto;
          padding-top: 28px;
        }

        .signal-board {
          min-height: 430px;
        }

        .share-grid {
          grid-template-columns: 1fr;
        }

        .journal-item {
          grid-template-columns: 1fr;
          gap: 8px;
        }

        .closing-mark {
          width: 88px;
          height: 88px;
        }
      }

      @media (max-width: 520px) {
        main {
          padding-bottom: 52px;
        }

        .hero h1 {
          font-size: 44px;
        }

        .section {
          padding: 46px 0;
        }

        .signal-board,
        .closing,
        .journal-lead,
        .share-card {
          padding: 20px;
        }

        .note-strip,
        .signal-card {
          width: 100%;
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">明</span>
        <span>{{ site.title }}</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#ai-notes">AI 学习</a>
        <a href="#life-notes">生活思考</a>
        <a href="#start">开始阅读</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>写给正在学习、实践、复盘的人。</span>
    </footer>
  </body>
</html>
