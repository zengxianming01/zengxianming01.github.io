---
layout: default
---

<article class="article{% if page.article_class %} {{ page.article_class }}{% endif %}">
  <header class="article-header">
    <p class="eyebrow">{{ page.category | default: "Post" }}</p>
    <h1>{{ page.title }}</h1>
    <div class="article-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
      {% if page.tags %}
      <span>{{ page.tags | join: " / " }}</span>
      {% endif %}
    </div>
  </header>

  <div class="article-body">
    {{ content }}
  </div>
</article>

{% if page.comments != false %}
<section style="max-width:860px;margin:0 auto;padding:48px 0;">
  <h2 style="margin-bottom:24px;">评论</h2>
  <script src="https://giscus.app/client.js"
    data-repo="shawnming068/shawnming068.github.io"
    data-repo-id="R_kgDOSyzUnQ"
    data-category="Announcements"
    data-category-id="DIC_kwDOSyzUnc4C-v5V"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="preferred_color_scheme"
    data-lang="zh-CN"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
</section>
{% endif %}
